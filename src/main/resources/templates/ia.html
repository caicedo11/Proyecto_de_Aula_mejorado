<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Educational Harmony IA - Spring AI</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="chat-container">
        <header class="chat-header"><h1>Bienvenido. ¿Que desea consultar?</h1></header>
        <div id="chatMessages" class="chat-messages"></div>
        <div class="chat-input">
            <input id="messageInput" placeholder="Escribe tu mensaje aquí..." autocomplete="off">
            <button id="sendButton">Enviar</button>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
