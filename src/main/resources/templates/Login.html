<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Educational Harmonie | Login</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #f0f0f0, #e0e0e0);
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: #0874e0;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 25px 5%;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      margin: 0;
      font-size: 1.8rem;
      letter-spacing: 1px;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
      font-weight: bold;
      transition: color 0.3s ease;
    }

    .nav-links a:hover {
      color: #1abc9c;
    }

    .main-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .login-container {
      background: #f7f7f7;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      padding: 40px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      color: #333;
      animation: fadeIn 1s ease-in-out;
    }

    .logo {
      margin-bottom: 20px;
    }

    .logo img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      margin-bottom: 10px;
      box-shadow: 0 0 10px rgba(8,116,224,0.3);
      object-fit: cover;
      border: 3px solid #0874e0;
    }

    .logo h2 {
      font-size: 1.4rem;
      margin-bottom: 25px;
      color: #0874e0;
      letter-spacing: 1px;
    }

    form h3 {
      margin-bottom: 20px;
      font-size: 1.2rem;
      color: #0874e0;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }

    label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 5px;
      color: #333;
    }

    input {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
      background-color: #fff;
      font-size: 0.95rem;
      transition: box-shadow 0.3s ease, transform 0.2s ease;
    }

    input:focus {
      box-shadow: 0 0 8px #00a8ff;
      transform: scale(1.02);
      border-color: #00a8ff;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(90deg, #0874e0, #00a8ff);
      color: #fff;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 10px rgba(8,116,224,0.6);
      margin-top: 10px;
    }

    button:hover {
      background: linear-gradient(90deg, #00a8ff, #0874e0);
      box-shadow: 0 0 20px rgba(0,168,255,0.8);
      transform: scale(1.05);
    }

    .message {
      margin-top: 15px;
      padding: 10px;
      border-radius: 5px;
      font-size: 0.9rem;
    }

    .error {
      background-color: #ffe6e6;
      color: #d63031;
      border: 1px solid #fab1a0;
    }

    .success {
      background-color: #e6ffe6;
      color: #00b894;
      border: 1px solid #55efc4;
    }

    footer {
      background-color: #0874e0;
      color: #fff;
      text-align: center;
      padding: 15px 0;
      font-size: 0.95rem;
      box-shadow: 0 -2px 8px rgba(0,0,0,0.2);
    }

    footer img {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      vertical-align: middle;
      margin-bottom: 5px;
      object-fit: cover;
      border: 2px solid white;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Estilos responsivos */
    @media (max-width: 768px) {
      header {
        padding: 15px 5%;
        flex-direction: column;
        text-align: center;
      }

      .nav-links {
        margin-top: 10px;
      }

      .nav-links a {
        margin: 0 10px;
      }

      .login-container {
        padding: 30px 20px;
        margin: 0 10px;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1><i class="fas fa-book-open"></i> EDUCATIONAL HARMONIE</h1>
    <nav class="nav-links">
      <a href="/"><i class="fas fa-home"></i> HOME</a>
    </nav>
  </header>

  <div class="main-container">
    <div class="login-container">
      <div class="logo">
        <!-- Cambia esta ruta por la correcta para tu logo -->
        <img src="/img/logonuevo.jpg" alt="Logo Educational Harmonie">
        <h2>Educational Harmonie</h2>
      </div>
      
      <form th:action="@{/login}" method="post">
        <h3>Iniciar Sesión</h3>
        
        <div class="input-group">
          <input type="text" name="username" placeholder="Usuario" required>
        </div>
        
        <div class="input-group">
          <input type="password" name="password" placeholder="Contraseña" required>
        </div>
        
        <button type="submit">Ingresar</button>
        
     
        <div th:if="${error}" class="message error" th:text="${error}"></div>
        <div th:if="${logout}" class="message success" th:text="${logout}"></div>
      </form>
    </div>
  </div>

  <footer>
   
    <img src="/img/logonuevo.jpg" alt="Logo Educational Harmonie">
    <p>© 2025 Educational Harmonie</p>
  </footer>

</body>
</html>
